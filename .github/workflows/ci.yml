name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  rust-msrv:
    name: Rust 1.75
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.75.0
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets

  independent-models:
    name: Agda, Idris 2, and Fortran
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v7
      - name: Install compilers
        run: dnf -y -q install Agda gcc-gfortran idris2 make
      - name: Compile and test models
        run: make fortran formal-check && scripts/test-fortran.sh target/release/elan-trace-score

  rpm:
    name: RPM
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install checkout prerequisite
        run: dnf -y -q install git
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install build tools
        run: >-
          dnf -y -q install binutils cargo cpio elfutils gcc-gfortran git make
          ripgrep rpm-build rpmdevtools rust systemd-rpm-macros
      - name: Build source and binary packages
        run: |
          rpm_topdir="$RUNNER_TEMP/rpmbuild"
          make packaging-check srpm RPM_TOPDIR="$rpm_topdir"
          rpmbuild --rebuild "$rpm_topdir"/SRPMS/*.src.rpm --define "_topdir $rpm_topdir"
          package=$(find "$rpm_topdir/RPMS" -name 'elan-guardian-[0-9]*.rpm' -print -quit)
          test -n "$package"
          scripts/verify-rpm.sh "$package"
          mkdir -p artifacts
          cp "$package" "$rpm_topdir"/SRPMS/*.src.rpm artifacts/
      - uses: actions/upload-artifact@v7
        with:
          name: elan-guardian-rpms
          path: artifacts/*

  debian:
    name: Ubuntu package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.75.0
      - name: Install build tools
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential cargo debhelper gfortran rustc
      - name: Build and verify binary package
        env:
          RUSTUP_TOOLCHAIN: 1.75.0
        run: |
          make packaging-check
          dpkg-buildpackage --build=binary --no-sign
          scripts/verify-deb.sh ../elan-guardian_0.2.12-1~ppa1~ubuntu26.04.1_amd64.deb

  kernel-patch:
    name: Linux ${{ matrix.kernel }} Rust-core module
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: "6.12"
            ref: v6.12
            check_patch: true
          - kernel: "7.1"
            ref: v7.1
            check_patch: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92.0
      - name: Install kernel build tools
        run: sudo apt-get update && sudo apt-get install -y bc bison flex libelf-dev libssl-dev
      - name: Fetch exact upstream source
        run: |
          git clone --depth=1 --branch '${{ matrix.ref }}' \
            https://github.com/torvalds/linux.git "$RUNNER_TEMP/linux"
      - name: Apply and compile patch
        if: matrix.check_patch
        run: |
          git -C "$RUNNER_TEMP/linux" apply --check "$GITHUB_WORKSPACE/kernel/0001-input-elan-i2c-add-in-place-recovery.patch"
          git -C "$RUNNER_TEMP/linux" apply "$GITHUB_WORKSPACE/kernel/0001-input-elan-i2c-add-in-place-recovery.patch"
          cp "$GITHUB_WORKSPACE/kernel/rust-shim/elan_rs_shim.h" \
            "$RUNNER_TEMP/linux/drivers/input/elan_rs_shim.h"
          make -C "$RUNNER_TEMP/linux" defconfig
          make -C "$RUNNER_TEMP/linux" -j2 \
            drivers/input/mouse/elan_i2c_core.o \
            drivers/input/mouse/elan_i2c_i2c.o \
            drivers/input/mouse/elan_i2c_smbus.o
      - name: Compile and link Rust-core module
        run: |
          make -C "$RUNNER_TEMP/linux" defconfig
          make -C "$RUNNER_TEMP/linux" -j2 \
            drivers/input/mouse/elan_i2c_core.o \
            drivers/input/mouse/elan_i2c_i2c.o \
            drivers/input/mouse/elan_i2c_smbus.o
          make -C kernel/rust-shim clean KDIR="$RUNNER_TEMP/linux"
          make -C kernel/rust-shim elan_rs_core.o KDIR="$RUNNER_TEMP/linux"
          make -C "$RUNNER_TEMP/linux" M="$GITHUB_WORKSPACE/kernel/rust-shim" elan_i2c.o
          test "$(nm -u kernel/rust-shim/elan_rs_core.o | awk '{print $2}')" = __x86_return_thunk
